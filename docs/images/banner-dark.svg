  <text x="500" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="63" font-weight="600" letter-spacing="-1" fill="#e6edf3">Explorer Terminal</text>
  <text x="500" y="186" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Helvetica Neue&quot;, Arial, sans-serif" font-size="22" fill="#9198a1">A real terminal docked in the File Explorer window</text>
